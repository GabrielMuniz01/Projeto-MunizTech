<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/favicon.ico" type="image/png" sizes="100x100">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/44fdb15698.js" crossorigin="anonymous"></script>
    <title>Cadastro - MunizTech</title>
</head>

<body>
    <div class="menu-overlay"></div>
    <header>
        <nav class="nav-bar">
            <a class="nav-img" href="Index.html">
                <img src="./assets/icon muniztech.png" alt="Logo da Muniztech">
            </a>
            <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-controls="main-menu"
                aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul id="main-menu">
                <li><a href="Index.html">HOME</a></li>
                <li><a href="Index.html#quem-somos">QUEM SOMOS</a></li>
                <li><a href="Index.html#servicos">SERVIÇOS</a></li>
                <li><a href="Index.html#contato">CONTATO</a></li>
                <li><a href="Login.html">LOGIN</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-box">
                <form id="register-form" class="auth-form active" method="POST">
                    <h2>Novo Cadastro</h2>
                    <p>Área restrita para criação de novas contas de clientes.</p>

                    <div class="input-group">
                        <input type="text" id="reg-nome" name="nome" required placeholder=" ">
                        <label for="reg-nome">Nome Completo</label>
                    </div>

                    <div class="input-group">
                        <input type="email" id="reg-email" name="email" required placeholder=" ">
                        <label for="reg-email">E-mail</label>
                    </div>

                    <div class="input-group">
                        <input type="text" id="reg-user" name="username" required placeholder=" ">
                        <label for="reg-user">Nome de Usuário</label>
                    </div>

                    <div class="input-group">
                        <input type="password" id="reg-pass" name="password" required placeholder=" ">
                        <label for="reg-pass">Definir Senha</label>
                    </div>

                    <button type="submit" class="btn-auth" id="btn-register">
                        <span class="btn-text">REALIZAR CADASTRO</span>
                        <div class="spinner-container">
                            <div class="spinner">
                                <div></div>
                                <div></div>
                                <div></div>
                                <div></div>
                                <div></div>
                                <div></div>
                            </div>
                        </div>
                    </button>
                    
                    <div id="register-message"></div>

                    <div style="margin-top: 20px; text-align: center;">
                        <a href="Login.html"
                            style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem;">← Voltar
                            para o Login</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 MunizTech. Atendimento rápido e confiável para notebooks.</p>
        </div>
    </footer>

    <script>
        const navToggle = document.querySelector('.nav-toggle');
        const navMenu = document.querySelector('.nav-bar ul');
        const menuOverlay = document.querySelector('.menu-overlay');

        function toggleMenu() {
            navToggle.classList.toggle('active');
            navMenu.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            const isExpanded = navToggle.classList.contains('active');
            navToggle.setAttribute('aria-expanded', isExpanded);
            document.body.style.overflow = isExpanded ? 'hidden' : 'auto';
        }

        navToggle.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', toggleMenu);


        const registerForm = document.getElementById('register-form');

        registerForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const btnRegister = document.getElementById('btn-register');
            const registerMessage = document.getElementById('register-message');
            const nome = document.getElementById('reg-nome').value;
            const email = document.getElementById('reg-email').value;
            const username = document.getElementById('reg-user').value;
            const password = document.getElementById('reg-pass').value;

            // Limpa mensagens e ativa carregamento
            registerMessage.textContent = '';
            registerMessage.className = '';
            btnRegister.classList.add('loading');
            btnRegister.disabled = true;

            try {
                const response = await fetch('http://localhost:3000/usuario', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ nome, email, username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    registerMessage.textContent = '✅ Usuário cadastrado com sucesso! Redirecionando...';
                    registerMessage.className = 'success';

                    setTimeout(() => {
                        window.location.href = 'Login.html';
                    }, 4500);

                } else {
                    registerMessage.textContent = '❌ ' + (data.error || 'Erro ao cadastrar usuário.');
                    registerMessage.className = 'error';
                    btnRegister.classList.remove('loading');
                    btnRegister.disabled = false;
                }
            } catch (error) {
                console.error('Erro ao enviar dados para o servidor:', error);
                registerMessage.textContent = '❌ Erro de conexão com o servidor.';
                registerMessage.className = 'error';
                btnRegister.classList.remove('loading');
                btnRegister.disabled = false;
            }
        });



    </script>
</body>

</html>
