<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/favicon.ico" type="image/png" sizes="100x100">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/44fdb15698.js" crossorigin="anonymous"></script>
    <title>Cadastro - MunizTech</title>
</head>

<body>
    <header>
        <nav class="nav-bar">
            <a class="nav-img" href="Index.html">
                <img src="./assets/icon muniztech.png" alt="Logo da Muniztech">
            </a>
            <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-controls="main-menu"
                aria-expanded="false">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
            <ul id="main-menu">
                <li><a href="Index.html">HOME</a></li>
                <li><a href="Index.html#quem-somos">QUEM SOMOS</a></li>
                <li><a href="Index.html#servicos">SERVIÇOS</a></li>
                <li><a href="Index.html#contato">CONTATO</a></li>
                <li><a href="Login.html">LOGIN</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-box">
                <form id="register-form" class="auth-form active" method="POST">
                    <h2>Novo Cadastro</h2>
                    <p>Área restrita para criação de novas contas de clientes.</p>

                    <div class="input-group">
                        <input type="text" id="reg-nome" name="nome" required placeholder=" ">
                        <label for="reg-nome">Nome Completo</label>
                    </div>

                    <div class="input-group">
                        <input type="email" id="reg-email" name="email" required placeholder=" ">
                        <label for="reg-email">E-mail</label>
                    </div>

                    <div class="input-group">
                        <input type="text" id="reg-user" name="username" required placeholder=" ">
                        <label for="reg-user">Nome de Usuário</label>
                    </div>

                    <div class="input-group">
                        <input type="password" id="reg-pass" name="password" required placeholder=" ">
                        <label for="reg-pass">Definir Senha</label>
                    </div>

                    <button type="submit" class="btn-auth">REALIZAR CADASTRO</button>

                    <!-- From Uiverse.io by bociKond -->
                    <div class="loading-overlay">
                        <div class="spinner">
                            <div></div>
                            <div></div>
                            <div></div>
                            <div></div>
                            <div></div>
                            <div></div>
                        </div>
                    </div>

                    <div style="margin-top: 20px; text-align: center;">
                        <a href="Login.html"
                            style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem;">← Voltar
                            para o Login</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 MunizTech. Atendimento rápido e confiável para notebooks.</p>
        </div>
    </footer>

    <script>
        const navToggle = document.querySelector('.nav-toggle'); // Seleciona o botão de toggle do menu
        const navMenu = document.querySelector('.nav-bar ul'); // Seleciona o menu de navegação

        navToggle.addEventListener('click', () => { // Adiciona um evento de clique ao botão de toggle
            navMenu.classList.toggle('show'); // Alterna a classe 'show' no menu para mostrar ou esconder o menu
            const expanded = navMenu.classList.contains('show'); // Verifica se o menu está atualmente mostrado
            navToggle.setAttribute('aria-expanded', expanded); // Atualiza o atributo aria-expanded para refletir o estado atual do menu
        });


        const registerForm = document.getElementById('register-form');
        registerForm.addEventListener('submit', async (event) => { // Adiciona um evento de submit ao formulário de registro.
            event.preventDefault(); // Impede o comportamento padrão de envio do formulário para que possamos lidar com ele via JavaScript.

            const nome = document.getElementById('reg-nome').value; // Obter o valor do campo de nome
            const email = document.getElementById('reg-email').value; // Obter o valor do campo de email
            const username = document.getElementById('reg-user').value; // Obter o valor do campo de username
            const password = document.getElementById('reg-pass').value; // Obter o valor do campo de password

            try { // Enviar os dados para o servidor
                const response = await fetch('http://localhost:3000/usuario', { // Certifique-se de que a URL esteja correta
                    method: 'POST', // Método HTTP para enviar dados
                    headers: {
                        'Content-Type': 'application/json' // Especifica que os dados estão no formato JSON
                    },
                    body: JSON.stringify({ nome, email, username, password }) // Converte os dados do formulário para JSON
                });

                const data = await response.json(); // Aguarda a resposta do servidor e converte para JSON

                if (response.ok) { // Verifica se a resposta foi bem-sucedida
                    alert('✅ Usuário cadastrado com sucesso!' + data.message)
                    // Exibe uma mensagem de sucesso
                    document.querySelector('.loading-overlay').style.display = 'flex'; // Exibe a sobreposição de carregamento
                    setTimeout(() => {
                        window.location.href = 'Login.html'; // Redireciona para a página de login após o cadastro
                    }, 5000); // Aguarda 2 segundos antes de redirecionar

                } else {
                    alert('❌ Erro ao cadastrar usuário: '); // Exibe uma mensagem de erro caso o cadastro falhe
                }
            } catch (error) {
                console.error('Erro ao enviar dados para o servidor:', error); // Loga o erro no console
                alert('❌ Ocorreu um erro ao tentar cadastrar. Por favor, tente novamente.'); // Exibe uma mensagem de erro genérica
            }
        });



    </script>
</body>

</html>
