<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/favicon.ico" type="image/png" sizes="100x100">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/44fdb15698.js" crossorigin="anonymous"></script>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>Document</title>
</head>

<body>
    <div class="menu-overlay"></div>
    <header>
        <nav class="nav-bar">
            <a class="nav-img" href="Index.html">
                <img src="./assets/icon muniztech.png" alt="Logo da Muniztech">
            </a>
            <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-controls="main-menu"
                aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul id="main-menu">
                <li><a href="Index.html">HOME</a></li>
                <li><a href="Index.html#quem-somos">QUEM SOMOS</a></li>
                <li><a href="Index.html#servicos">SERVIÇOS</a></li>
                <li><a href="Index.html#contato">CONTATO</a></li>
                <li><a href="#">LOGIN</a></li>
            </ul>
        </nav>
    </header>
    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-box">
                <!-- Formulário de Login -->
                <form id="login-form" class="auth-form active" method="POST">
                    <h2>Login do Cliente</h2>
                    <p>Acesse sua conta para acompanhar seus serviços.</p>

                    <div class="input-group">
                        <input type="text" id="login-user" name="username" required placeholder=" ">
                        <label for="login-user">Usuário ou E-mail</label>
                    </div>

                    <div class="input-group">
                        <input type="password" id="login-pass" name="password" required placeholder=" ">
                        <label for="login-pass">Senha</label>
                    </div>

                    <div class="form-options">
                        <label><input type="checkbox"> Lembrar de mim</label>
                        <a href="#">Esqueceu a senha?</a>
                    </div>

                    <button type="submit" class="btn-auth" id="btn-login">
                        <span class="btn-text">ENTRAR NO PAINEL</span>
                        <div class="spinner-container">
                            <div class="spinner">
                                <div></div>
                                <div></div>
                                <div></div>
                                <div></div>
                                <div></div>
                                <div></div>
                            </div>
                        </div>
                    </button>
                    
                    <div id="login-message"></div>

                    <div
                        style="margin-top: 25px; text-align: center; border-top: 1px solid var(--border-color); padding-top: 20px;">
                        <p style="font-size: 0.85rem; color: var(--text-secondary);">Ainda não tem cadastro? <br>
                            <a href="Index.html#contato"
                                style="color: var(--secondary-blue); text-decoration: none; font-weight: 600;">Solicite
                                seu acesso aqui</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 MunizTech. Atendimento rápido e confiável para notebooks.</p>
        </div>
    </footer>


</body>

</html>

<script>
    const navToggle = document.querySelector('.nav-toggle');
    const navMenu = document.querySelector('.nav-bar ul');
    const menuOverlay = document.querySelector('.menu-overlay');

    function toggleMenu() {
        navToggle.classList.toggle('active');
        navMenu.classList.toggle('active');
        menuOverlay.classList.toggle('active');
        const isExpanded = navToggle.classList.contains('active');
        navToggle.setAttribute('aria-expanded', isExpanded);
        document.body.style.overflow = isExpanded ? 'hidden' : 'auto';
    }

    navToggle.addEventListener('click', toggleMenu);
    menuOverlay.addEventListener('click', toggleMenu);

    const loginForm = document.getElementById('login-form');

    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault(); // Impede o envio tradicional do formulário

        const btnLogin = document.getElementById('btn-login');
        const loginMessage = document.getElementById('login-message');
        const username = document.getElementById('login-user').value;
        const password = document.getElementById('login-pass').value;

        // Limpa mensagens anteriores e ativa estado de carregamento
        loginMessage.textContent = '';
        loginMessage.className = '';
        btnLogin.classList.add('loading');
        btnLogin.disabled = true;

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Sucesso no login
                loginMessage.textContent = '✅ Login bem-sucedido! Redirecionando...';
                loginMessage.className = 'success';

                sessionStorage.setItem('userId', data.user.id);
                sessionStorage.setItem('nameUser', data.user.nome);
                sessionStorage.setItem('userEmail', data.user.email);
                sessionStorage.setItem('userName', data.user.username);
                sessionStorage.setItem('userPerfil', data.user.perfil);

                // Redireciona com base no perfil
                setTimeout(() => {
                    if (data.user.perfil === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 1500);

            } else {
                // Erro retornado pelo servidor
                loginMessage.textContent = '❌ ' + (data.error || 'Usuário ou senha incorretos.');
                loginMessage.className = 'error';
                btnLogin.classList.remove('loading');
                btnLogin.disabled = false;
            }
        } catch (error) {
            console.error('Erro ao enviar dados para o servidor:', error);
            loginMessage.textContent = '❌ Erro de conexão. Verifique se o servidor está rodando.';
            loginMessage.className = 'error';
            btnLogin.classList.remove('loading');
            btnLogin.disabled = false;
        }
    });


</script>
