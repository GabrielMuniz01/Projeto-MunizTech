<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/favicon.ico" type="image/png" sizes="100x100">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/44fdb15698.js" crossorigin="anonymous"></script>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>Document</title>
</head>

<body>
    <header>
        <nav class="nav-bar">
            <a class="nav-img" href="Index.html">
                <img src="./assets/icon muniztech.png" alt="Logo da Muniztech">
            </a>
            <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-controls="main-menu"
                aria-expanded="false">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
            <ul id="main-menu">
                <li><a href="Index.html">HOME</a></li>
                <li><a href="#quem-somos">QUEM SOMOS</a></li>
                <li><a href="#servicos">SERVIÇOS</a></li>
                <li><a href="#contato">CONTATO</a></li>
                <li><a href="Login.html">LOGIN</a></li>
            </ul>
        </nav>
    </header>
    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-box">
                <!-- Formulário de Login -->
                <form id="login-form" class="auth-form active" action="process_login.php" method="POST">
                    <h2>Login do Cliente</h2>
                    <p>Acesse sua conta para acompanhar seus serviços.</p>

                    <div class="input-group">
                        <input type="text" id="login-user" name="username" required placeholder=" ">
                        <label for="login-user">Usuário ou E-mail</label>
                    </div>

                    <div class="input-group">
                        <input type="password" id="login-pass" name="password" required placeholder=" ">
                        <label for="login-pass">Senha</label>
                    </div>

                    <div class="form-options">
                        <label><input type="checkbox"> Lembrar de mim</label>
                        <a href="#">Esqueceu a senha?</a>
                    </div>

                    <button type="submit" class="btn-auth">ENTRAR NO PAINEL</button>

                    <!-- From Uiverse.io by satyamchaudharydev -->

                    <div class="loading-overlay">
                        <div class="loader"></div>
                    </div>

                    <div
                        style="margin-top: 25px; text-align: center; border-top: 1px solid var(--border-color); padding-top: 20px;">
                        <p style="font-size: 0.85rem; color: var(--text-secondary);">Ainda não tem cadastro? <br>
                            <a href="Index.html#contato"
                                style="color: var(--secondary-blue); text-decoration: none; font-weight: 600;">Solicite
                                seu acesso aqui</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 MunizTech. Atendimento rápido e confiável para notebooks.</p>
        </div>
    </footer>


</body>

</html>
